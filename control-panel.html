<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ควบคุมไฟผ่าน IP</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1e293b,#0f172a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f1f5f9;
  }
  .card {
    background: #1e293bcc;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 40px 40px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    width: 320px;
  }
  h1 { font-size: 18px; margin-bottom: 5px; color: #94a3b8; font-weight: 500; }

  .ip-row {
    display: flex;
    gap: 8px;
    margin: 15px 0 20px;
  }
  .ip-row input {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    color: #f1f5f9;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
  }
  .ip-row input:focus { border-color: #60a5fa; }
  .ip-row button {
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .ip-row button:hover { background: #1d4ed8; }

  .bulb {
    font-size: 70px;
    margin: 10px 0;
    transition: filter 0.3s, transform 0.3s;
    filter: grayscale(100%) brightness(0.6);
  }
  .bulb.on {
    filter: none;
    transform: scale(1.1);
    text-shadow: 0 0 40px #fbbf24, 0 0 80px #fbbf24;
  }
  .status {
    font-size: 16px;
    margin-bottom: 20px;
    color: #cbd5e1;
  }
  .status span { font-weight: 700; }
  .status.on span { color: #facc15; }
  .status.off span { color: #64748b; }

  .switch {
    position: relative;
    display: inline-block;
    width: 90px;
    height: 46px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #334155;
    transition: 0.3s;
    border-radius: 46px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 38px; width: 38px;
    left: 4px; bottom: 4px;
    background-color: #f1f5f9;
    transition: 0.3s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: #22c55e; }
  input:checked + .slider:before { transform: translateX(44px); }
  .switch.disabled { opacity: 0.4; pointer-events: none; }

  .footer {
    margin-top: 18px;
    font-size: 11px;
    min-height: 14px;
  }
  .footer.ok { color: #4ade80; }
  .footer.err { color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>ควบคุมไฟผ่าน IP (ESP8266)</h1>

    <div class="ip-row">
      <input type="text" id="espIp" placeholder="เช่น 192.168.1.50" value="192.168.1.50">
      <button onclick="connect()">เชื่อมต่อ</button>
    </div>

    <div class="bulb" id="bulb">&#128161;</div>
    <div class="status" id="statusText">ยังไม่ได้เชื่อมต่อ</div>
    <label class="switch disabled" id="switchWrap">
      <input type="checkbox" id="toggleSwitch" onchange="toggleLight()">
      <span class="slider"></span>
    </label>
    <div class="footer" id="footer"></div>
  </div>

<script>
// ตั้งค่า IP เริ่มต้นของ ESP8266 ตรงนี้ได้ (ดูจาก Serial Monitor ตอนบอร์ดต่อ WiFi สำเร็จ)
let espIp = document.getElementById('espIp').value;
let pollTimer = null;

function updateUI(state) {
  document.getElementById('toggleSwitch').checked = state;
  document.getElementById('bulb').className = 'bulb' + (state ? ' on' : '');
  const st = document.getElementById('statusText');
  st.className = 'status ' + (state ? 'on' : 'off');
  st.innerHTML = state ? 'สถานะ: <span>เปิดอยู่</span>' : 'สถานะ: <span>ปิดอยู่</span>';
}

function setFooter(msg, ok) {
  const f = document.getElementById('footer');
  f.textContent = msg;
  f.className = 'footer ' + (ok ? 'ok' : 'err');
}

function baseUrl() {
  return 'http://' + espIp;
}

function toggleLight() {
  const checked = document.getElementById('toggleSwitch').checked;
  fetch(baseUrl() + (checked ? '/on' : '/off'))
    .then(r => r.json())
    .then(data => {
      updateUI(data.state);
      setFooter('เชื่อมต่อกับ ' + espIp + ' สำเร็จ', true);
    })
    .catch(() => setFooter('ส่งคำสั่งไม่สำเร็จ ตรวจสอบ IP และเครือข่าย', false));
}

function fetchState() {
  fetch(baseUrl() + '/state')
    .then(r => r.json())
    .then(data => {
      updateUI(data.state);
      setFooter('เชื่อมต่อกับ ' + espIp + ' สำเร็จ', true);
      document.getElementById('switchWrap').classList.remove('disabled');
    })
    .catch(() => {
      setFooter('เชื่อมต่อไม่ได้ ตรวจสอบว่า ESP8266 เปิดอยู่และอยู่วง WiFi เดียวกัน', false);
      document.getElementById('switchWrap').classList.add('disabled');
    });
}

function connect() {
  espIp = document.getElementById('espIp').value.trim();
  if (pollTimer) clearInterval(pollTimer);
  fetchState();
  pollTimer = setInterval(fetchState, 3000);
}

// เริ่มเชื่อมต่อครั้งแรกด้วยค่า IP เริ่มต้นในช่อง input
connect();
</script>
</body>
</html>
